<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Maria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <div id="login-view" class="shell">
      <form id="login-form" class="panel">
        <h1>Admin</h1>
        <p class="muted">Connecte-toi pour gérer le site</p>
        <label>
          Mot de passe
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn btn--primary">Entrer</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </div>

    <div id="admin-view" class="shell shell--wide" hidden>
      <header class="admin-top">
        <div>
          <h1>Panneau admin</h1>
          <p class="muted">Nom, logo et vidéos illimitées</p>
        </div>
        <div class="admin-top__actions">
          <a class="btn btn--ghost" href="/">Voir le site</a>
          <button type="button" id="logout-btn" class="btn btn--ghost">Déconnexion</button>
        </div>
      </header>

      <section class="panel">
        <h2>Identité</h2>
        <form id="brand-form" class="stack">
          <label>
            Nom du site
            <input type="text" id="brand-name" name="brandName" required maxlength="80" />
          </label>
          <label>
            Phrase d’accueil
            <input type="text" id="brand-tagline" name="tagline" maxlength="200" />
          </label>
          <button type="submit" class="btn btn--primary">Enregistrer le nom</button>
          <p id="brand-status" class="status" hidden></p>
        </form>

        <form id="logo-form" class="stack" style="margin-top: 1.5rem">
          <label>
            Nouveau logo (image)
            <input type="file" id="logo-file" name="logo" accept="image/*" required />
          </label>
          <div class="logo-preview-wrap">
            <img id="logo-preview" class="logo-preview" src="/assets/logo.svg" alt="Logo actuel" />
          </div>
          <button type="submit" class="btn btn--primary">Uploader le logo</button>
          <p id="logo-status" class="status" hidden></p>
        </form>
      </section>

      <section class="panel">
        <h2>Ajouter une vidéo</h2>
        <form id="video-form" class="stack">
          <label>
            Titre (affiché sous la vidéo)
            <input type="text" id="video-title" name="title" required maxlength="160" />
          </label>
          <label>
            Fichier vidéo
            <input type="file" id="video-file" name="video" accept="video/*" required />
          </label>
          <button type="submit" class="btn btn--primary">Uploader la vidéo</button>
          <p id="video-status" class="status" hidden></p>
        </form>
      </section>

      <section class="panel">
        <h2>Vidéos publiées</h2>
        <div id="admin-video-list" class="admin-videos"></div>
        <p id="admin-video-empty" class="muted" hidden>Aucune vidéo pour l’instant.</p>
      </section>
    </div>

    <script src="/admin/admin.js"></script>
  </body>
</html>
